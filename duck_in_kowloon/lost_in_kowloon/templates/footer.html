{% load static %}
<footer class="bg-emerald-900 font-sans text-surface">
    <div class="mx-auto max-w-7xl px-4 py-10 sm:px-6 sm:py-12 lg:px-8">

        <!--
            Mobile: actions → social media → business information
            Desktop: business information → actions → social media
        -->
        <div class="grid grid-cols-1 gap-8 md:gap-10 lg:grid-cols-3 lg:items-start lg:gap-12">

            <!-- Business information -->
            <section class="order-3 min-w-0 text-center lg:order-1 lg:text-left" aria-labelledby="footer-business-heading">
                <h2 id="footer-business-heading" class="font-heading text-xl font-semibold leading-tight">
                    Duck In Kowloon
                </h2>

                <address class="mt-4 font-sans text-sm not-italic leading-relaxed text-stone-200">
                    <a href="https://www.google.com/maps/search/?api=1&query=N%C3%B8rre+Farimagsgade+15%2C+1364+K%C3%B8benhavn+K"
                        target="_blank" rel="noopener noreferrer"
                        class="block min-h-11 transition-colors hover:text-accent focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent">
                        Nørre Farimagsgade 15<br>
                        1364 København K
                        <span aria-hidden="true" class="text-accent">
                            ↗
                        </span>
                        <span class="sr-only"> — open in Google Maps</span>
                    </a>

                    <a href="mailto:kontakt@duckin.dk"
                        class="mt-2 block wrap-anywhere transition-colors hover:text-accent focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent">
                        kontakt@duckin.dk
                    </a>

                    <a href="tel:1223456"
                        class="block transition-colors hover:text-accent focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent">
                        Mobile: 1223456
                    </a>

                    <p>CVR: 46541154</p>
                </address>
            </section>

            <!-- Phone and Contact actions -->
            <nav class="order-1 flex flex-wrap items-start justify-center gap-6 sm:gap-8 lg:order-2" aria-label="Contact actions">
                <a href="tel:1223456" aria-label="Call Duck In Kowloon at 1223456"
                    class="group flex min-w-24 flex-col items-center gap-2 rounded-lg text-center focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent">
                    <span
                        class="flex h-14 w-14 items-center justify-center rounded-lg bg-accent text-emerald-900 transition-colors group-hover:bg-accent-hover"
                        aria-hidden="true">
                        <!-- Phone icon (inline SVG) -->
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" class="h-6 w-6">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M2.5 5.5A2.5 2.5 0 0 1 5 3h2.1a1.5 1.5 0 0 1 1.46 1.16l.65 2.8a1.5 1.5 0 0 1-.76 1.66l-1.5.83a14 14 0 0 0 5.6 5.6l.83-1.5a1.5 1.5 0 0 1 1.66-.76l2.8.65A1.5 1.5 0 0 1 19 14.9V17a2.5 2.5 0 0 1-2.5 2.5h-1C8.04 19.5 2.5 13.96 2.5 7.5v-2Z" />
                        </svg>
                    </span>

                    <span
                        class="font-sans text-sm font-medium transition-colors group-hover:text-accent">
                        Call us
                    </span>
                </a>

                <a href="{% url 'contact' %}" aria-label="Contact Duck In Kowloon"
                    class="group flex min-w-24 flex-col items-center gap-2 rounded-lg text-center focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent">
                    <span
                        class="flex h-14 w-14 items-center justify-center rounded-lg bg-accent text-emerald-900 transition-colors group-hover:bg-accent-hover"
                        aria-hidden="true">
                        <!-- Envelope icon (inline SVG) -->
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" class="h-6 w-6">
                            <rect x="3" y="5" width="18" height="14" rx="2" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="m4 7 8 6 8-6" />
                        </svg>
                    </span>

                    <span
                        class="font-sans text-sm font-medium transition-colors group-hover:text-accent">
                        Contact
                    </span>
                </a>
            </nav>

            <!-- Social media -->
            <nav class="order-2 flex flex-col items-center gap-4 lg:order-3 lg:items-end" aria-label="Social media">
                <p class="font-sans text-sm font-medium text-stone-200">
                    Follow us
                </p>

                <div class="flex flex-wrap items-center justify-center gap-3 lg:justify-end">
                    <!-- Replace # with the real social profile URLs -->

                    <a href="#" aria-label="Instagram"
                        class="inline-flex h-11 w-11 shrink-0 items-center justify-center rounded text-accent transition-colors hover:text-surface focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" class="h-6 w-6" aria-hidden="true">
                            <rect x="3" y="3" width="18" height="18" rx="5" />
                            <circle cx="12" cy="12" r="4" />
                            <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" />
                        </svg>
                    </a>

                    <a href="#" aria-label="TikTok"
                        class="inline-flex h-11 w-11 shrink-0 items-center justify-center rounded text-accent transition-colors hover:text-surface focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-6 w-6"
                            aria-hidden="true">
                            <path
                                d="M19.6 7.1a6.8 6.8 0 0 1-4.2-1.5v8.1a6.1 6.1 0 1 1-5.3-6.05v3.35a2.8 2.8 0 1 0 2 2.7V2h3.3a3.8 3.8 0 0 0 4.2 3.8v1.3Z" />
                        </svg>
                    </a>

                    <a href="#" aria-label="Facebook"
                        class="inline-flex h-11 w-11 shrink-0 items-center justify-center rounded text-accent transition-colors hover:text-surface focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-6 w-6"
                            aria-hidden="true">
                            <path
                                d="M13.5 21v-8h2.7l.4-3.1h-3.1v-2c0-.9.3-1.5 1.6-1.5h1.7V3.6c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.1H7.3V13h2.8v8h3.4Z" />
                        </svg>

                </div>
            </nav>
        </div>

        <!-- Copyright -->
        <div class="mt-8 border-t border-accent/30 pt-5 text-center">
            <p class="font-sans text-xs leading-relaxed text-stone-200">
                &copy; <span id="copyright-year">2026</span>
                Duck In Kowloon. All rights reserved.
            </p>
        </div>
    </div>
</footer>

<script>
    // Automatically update the copyright year.
    document.getElementById("copyright-year").textContent =

</script>
