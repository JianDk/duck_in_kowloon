{% load static %}
<section class="relative isolate flex min-h-[calc(100dvh-10rem)] w-full items-center justify-center overflow-hidden bg-black font-sans">

    <!-- Background video -->
    <video class="absolute inset-0 z-0 h-full w-full object-cover" autoplay muted loop playsinline preload="metadata"
        poster="{% static 'images/logo.png' %}" aria-label="Steaming dim sum being prepared">
        <source src="{% static 'videos/video_presentation.mp4' %}" type="video/mp4">
        Your browser does not support HTML video.
    </video>

    <!-- Dark overlay -->
    <div class="absolute inset-0 z-10 bg-black/40"></div>

    <!-- Logo and text -->
    <div class="relative z-20 flex w-full max-w-5xl flex-col items-center px-4 py-8 text-center text-white sm:px-6 sm:py-10 lg:px-8 [@media(max-height:500px)]:py-4">

        <img src="{% static 'images/logo.png' %}" alt="Duck in Kowloon logo"
            class="mb-4 h-28 w-28 object-contain drop-shadow-lg sm:h-36 sm:w-36 lg:h-40 lg:w-40 [@media(max-height:500px)]:h-16 [@media(max-height:500px)]:w-16">

        <h1 class="max-w-full wrap-break-word font-heading text-3xl font-bold leading-tight drop-shadow-lg sm:text-4xl lg:text-5xl">
            Duck in Kowloon
        </h1>

        <p class="mt-4 max-w-2xl font-sans text-lg italic leading-relaxed drop-shadow-lg sm:text-xl lg:text-2xl">
            Let's get lost in Kowloon!
        </p>
    </div>
</section>
